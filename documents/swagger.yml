openapi: 3.0.3
info:
  title: API Core - Plataforma de Oficios (MVP)
  version: 1.9.0
  description: |
    Contratos REST para la gestión de tickets, operarios y autenticación del MVP.

    ### Autenticación
    Los endpoints protegidos requieren el header `Authorization: Bearer <token>`.
    El token JWT se obtiene en `POST /api/v1/auth/login` y contiene los claims
    `user_id` (UUID) y `rol` (CLIENTE | OPERARIO | ADMIN), con una expiración de 24 horas.

    ### Roles
    - **CLIENTE**: crea solicitudes de servicio.
    - **OPERARIO**: toma trabajos de la bolsa, avanza estados y finaliza con evidencia.
    - **ADMIN**: supervisión (puede actualizar estados).
servers:
  - url: http://localhost:8080
    description: Servidor de Desarrollo Local
tags:
  - name: Auth
    description: Registro e inicio de sesión de usuarios
  - name: Usuarios
    description: Consulta y edición del perfil y contraseña del usuario autenticado
  - name: Tickets (Cliente)
    description: Endpoints disponibles para usuarios con rol CLIENTE
  - name: Tickets (Operario)
    description: Endpoints disponibles para usuarios con rol OPERARIO
  - name: Tickets (Operario / Admin)
    description: Endpoints disponibles para OPERARIO y ADMIN
  - name: Servicios
    description: Catálogo de servicios ofrecidos por la plataforma
  - name: Operarios
    description: Configuración de especialidades (oficios) del operario autenticado
  - name: Admin
    description: Gestión administrativa de aprobación de operarios
paths:
  /api/v1/auth/register:
    post:
      summary: Registrar un Usuario
      description: |
        Crea un nuevo usuario en la plataforma y hashea la contraseña con bcrypt.
        Solo se permite registrarse con rol **CLIENTE** u **OPERARIO** (el rol ADMIN no es público).
        El email debe ser único.
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioRegistroRequest'
      responses:
        '201':
          description: Usuario registrado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioRegistroResponse'
        '400':
          description: Datos inválidos o rol no permitido (solo CLIENTE u OPERARIO)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: El email ya está registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/login:
    post:
      summary: Iniciar Sesión
      description: |
        Valida las credenciales del usuario y devuelve un JWT firmado (HS256)
        con expiración de 24 horas. El token incluye los claims `user_id` y `rol`,
        y debe enviarse como `Authorization: Bearer <token>` en los endpoints protegidos.
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioLoginRequest'
      responses:
        '200':
          description: Autenticación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioLoginResponse'
        '400':
          description: Cuerpo de solicitud inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Credenciales inválidas (email inexistente o contraseña incorrecta)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/operarios:
    get:
      summary: Listar Operarios (Admin)
      description: |
        Devuelve todos los usuarios con rol **OPERARIO**, ordenados por `created_at` descendente,
        incluyendo su `estado_aprobacion` (`PENDIENTE`, `APROBADO`, `RECHAZADO`). Nunca expone `password_hash`.

        Acepta el parámetro opcional `?estado=PENDIENTE|APROBADO|RECHAZADO`. Requiere rol **ADMIN**.
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - name: estado
          in: query
          required: false
          description: Filtra operarios por estado de aprobación.
          schema:
            type: string
            enum: [PENDIENTE, APROBADO, RECHAZADO]
          example: "PENDIENTE"
      responses:
        '200':
          description: Lista de operarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OperarioAdminItem'
        '400':
          description: Parámetro estado inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token ausente, inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: El usuario autenticado no tiene rol ADMIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/admin/operarios/{id}/aprobacion:
    patch:
      summary: Aprobar o Rechazar un Operario (Admin)
      description: |
        Actualiza el `estado_aprobacion` de un usuario con rol **OPERARIO** a `APROBADO` o `RECHAZADO`.
        Requiere exclusivamente rol **ADMIN**.
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID del usuario operario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperarioActualizarAprobacionRequest'
      responses:
        '200':
          description: Estado de aprobación actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperarioAdminItem'
        '400':
          description: UUID inválido, estado_aprobacion no permitido o el usuario no tiene rol OPERARIO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token ausente, inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: El usuario autenticado no tiene rol ADMIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users/me:
    get:
      summary: Obtener Mi Perfil
      description: |
        Devuelve los datos públicos del usuario autenticado (`id`, `nombre`, `email`,
        `telefono`, `rol`, `created_at`). Nunca incluye `password_hash`.

        Disponible para cualquier rol autenticado (**CLIENTE**, **OPERARIO** o **ADMIN**).
      tags:
        - Usuarios
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil del usuario autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: Token ausente, inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Rol no autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Actualizar Mi Perfil
      description: |
        Actualiza el `nombre` y `telefono` del usuario autenticado y devuelve el perfil
        actualizado. Valida que `nombre` no esté vacío (`400 Bad Request`).

        Disponible para **CLIENTE**, **OPERARIO** y **ADMIN**.
      tags:
        - Usuarios
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioActualizarPerfilRequest'
      responses:
        '200':
          description: Perfil actualizado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: El nombre está vacío o los datos enviados son inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token ausente, inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Rol no autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users/me/password:
    patch:
      summary: Cambiar Mi Contraseña
      description: |
        Cambia la contraseña del usuario autenticado:
        - Valida que `password_nueva` tenga al menos 6 caracteres (`400 Bad Request`).
        - Verifica `password_actual` contra el hash bcrypt actual (`401 Unauthorized` si no coincide).
        - Guarda el nuevo hash bcrypt y devuelve `{ "message": "contraseña actualizada correctamente" }`.

        Disponible para **CLIENTE**, **OPERARIO** y **ADMIN**.
      tags:
        - Usuarios
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioCambiarPasswordRequest'
      responses:
        '200':
          description: Contraseña actualizada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: La nueva contraseña tiene menos de 6 caracteres o el body es inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: La contraseña actual es incorrecta o el token es inválido/expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Rol no autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/tickets:
    post:
      summary: Crear una Solicitud de Servicio
      description: |
        Crea un nuevo ticket en estado **CREADO**. Requiere rol **CLIENTE**.

        El `cliente_id` **no** se envía en el body: se obtiene automáticamente
        del claim `user_id` del JWT.
      tags:
        - Tickets (Cliente)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketCrearRequest'
      responses:
        '201':
          description: Ticket creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketCreadoResponse'
        '400':
          description: Cuerpo de solicitud inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token ausente, inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: El usuario autenticado no tiene rol CLIENTE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: Listar Tickets (filtrado por rol)
      description: |
        Devuelve los tickets visibles para el usuario autenticado, ordenados por
        fecha de creación descendente. El filtro de usuario se aplica según el rol
        del JWT:

        - **CLIENTE**: solo los tickets creados por él.
        - **OPERARIO**: solo los tickets asignados a él.
        - **ADMIN**: todos los tickets de la plataforma.

        Si no hay resultados, devuelve un array vacío `[]`.
      tags:
        - Tickets (Cliente)
        - Tickets (Operario)
        - Tickets (Operario / Admin)
      security:
        - bearerAuth: []
      parameters:
        - name: estado
          in: query
          required: false
          description: Filtra por estado del ticket. Si el valor no es válido, responde 400.
          schema:
            type: string
            enum: [CREADO, ASIGNADO, EN_CAMINO, EN_PROGRESO, FINALIZADO, CANCELADO]
          example: "EN_PROGRESO"
      responses:
        '200':
          description: Lista de tickets visibles para el usuario ([] si no hay ninguno)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ticket'
        '400':
          description: Valor de estado inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token ausente, inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: El usuario autenticado no tiene un rol permitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/tickets/disponibles:
    get:
      summary: Listar Bolsa de Trabajo (filtrada por especialidades)
      description: |
        Devuelve los tickets en estado **CREADO** sin asignar cuyo `servicio_id` coincide
        con alguna de las especialidades registradas por el operario autenticado (`operario_services`).
        Requiere rol **OPERARIO**.

        Si el operario aún no configuró especialidades o no hay tickets disponibles para sus
        oficios, devuelve `[]` (`200 OK`).
      tags:
        - Tickets (Operario)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de tickets disponibles para las especialidades del operario ([] si no hay ninguno)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketDisponible'
        '401':
          description: Token ausente, inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: El usuario no tiene rol OPERARIO o su cuenta aún no está en estado APROBADO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/operarios/me/servicios:
    get:
      summary: Listar Mis Especialidades
      description: |
        Devuelve los servicios (oficios) configurados por el operario autenticado,
        ordenados por `id` ascendente. Requiere exclusivamente rol **OPERARIO**.

        Si el operario aún no seleccionó ninguna especialidad, devuelve `[]` (`200 OK`).
      tags:
        - Operarios
        - Servicios
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de especialidades del operario
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Service'
        '401':
          description: Token ausente, inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: El usuario autenticado no tiene rol OPERARIO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Actualizar Mis Especialidades
      description: |
        Reemplaza de forma idempotente y atómica (dentro de una transacción SQL) la lista
        de especialidades asociadas al operario autenticado. Requiere exclusivamente rol **OPERARIO**.

        - Valida que todos los IDs enviados en `servicio_ids` existan en el catálogo `services`
          (si alguno no existe o el body es inválido, devuelve `400 Bad Request` sin aplicar cambios).
        - Enviar `{"servicio_ids": []}` limpia todas las especialidades del operario.
        - Devuelve la lista actualizada de objetos `Service`.
      tags:
        - Operarios
        - Servicios
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperarioActualizarServiciosRequest'
      responses:
        '200':
          description: Especialidades actualizadas exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Service'
        '400':
          description: Cuerpo de solicitud inválido o algún servicio_id no existe en el catálogo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token ausente, inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: El usuario autenticado no tiene rol OPERARIO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/operarios/me/rating:
    get:
      summary: Obtener Mi Reputación y Reseñas
      description: |
        Devuelve el promedio de calificación (`1..5`, o `0` si aún no posee reseñas),
        la cantidad total de reseñas y el listado completo de calificaciones recibidas
        por el operario autenticado, ordenadas de más reciente a más antigua.

        Requiere exclusivamente rol **OPERARIO**.
      tags:
        - Operarios
        - Tickets (Operario)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Resumen de reputación y listado de reseñas del operario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperarioRating'
        '401':
          description: Token ausente, inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: El usuario autenticado no tiene rol OPERARIO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/services:
    get:
      summary: Listar Catálogo de Servicios
      description: |
        Devuelve el catálogo completo de servicios ofrecidos por la plataforma
        (plomería, electricidad, etc.), ordenado por `id` ascendente.

        Requiere un usuario autenticado (cualquier rol: CLIENTE, OPERARIO o ADMIN).
        Si no hay servicios cargados, devuelve un array vacío `[]`.
      tags:
        - Servicios
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Catálogo de servicios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Service'
        '401':
          description: Token ausente, inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Crear un Servicio (Admin)
      description: |
        Crea un nuevo servicio en el catálogo de la plataforma. Requiere exclusivamente rol **ADMIN**.

        Validaciones:
        - `nombre` no vacío (`<= 100` caracteres) y único en el catálogo (`409 Conflict` si ya existe).
        - `tarifa_base > 0` (`400 Bad Request` si no).
      tags:
        - Servicios
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServicePayloadRequest'
      responses:
        '201':
          description: Servicio creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '400':
          description: Nombre vacío, tarifa_base <= 0 o cuerpo inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token ausente, inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: El usuario autenticado no tiene rol ADMIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflicto - Ya existe un servicio con ese nombre
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/services/{id}:
    patch:
      summary: Actualizar un Servicio (Admin)
      description: |
        Actualiza el `nombre`, `descripcion` y `tarifa_base` de un servicio existente.
        Requiere exclusivamente rol **ADMIN**.
      tags:
        - Servicios
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          description: ID numérico del servicio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServicePayloadRequest'
      responses:
        '200':
          description: Servicio actualizado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '400':
          description: ID inválido, nombre vacío, tarifa_base <= 0 o cuerpo inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token ausente, inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: El usuario autenticado no tiene rol ADMIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Servicio no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflicto - Ya existe otro servicio con ese nombre
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Eliminar un Servicio (Admin)
      description: |
        Elimina un servicio del catálogo. Requiere exclusivamente rol **ADMIN**.

        Si existen tickets vinculados a este servicio, PostgreSQL rechaza el borrado (`ON DELETE RESTRICT`)
        y la API responde `409 Conflict` indicando que no puede eliminarse porque tiene tickets asociados.
      tags:
        - Servicios
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          description: ID numérico del servicio
      responses:
        '200':
          description: Servicio eliminado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: ID de servicio inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token ausente, inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: El usuario autenticado no tiene rol ADMIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Servicio no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflicto - No se puede eliminar porque tiene tickets vinculados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/tickets/{id}/asignar:
    patch:
      summary: Aceptar Trabajo (Asignación)
      description: |
        El operario intenta tomar el ticket. Maneja la concurrencia de forma segura
        a nivel de base de datos: la actualización solo se aplica si el ticket sigue
        en estado **CREADO**. Requiere rol **OPERARIO**.

        Validación de especialidad: el operario debe tener registrado el `servicio_id`
        del ticket en sus especialidades (`PUT /api/v1/operarios/me/servicios`); de lo
        contrario se rechaza con `403 Forbidden`.

        El `operario_id` **no** se envía en el body: se obtiene del claim `user_id` del JWT.
        Si otro operario tomó el ticket primero, se devuelve `409 Conflict`.
      tags:
        - Tickets (Operario)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID del ticket
      responses:
        '200':
          description: Ticket asignado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: UUID de ticket con formato inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token ausente, inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: El usuario no tiene rol OPERARIO, su cuenta no está APROBADO o no posee la especialidad requerida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Ticket no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflicto - El ticket ya fue asignado a otro operario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/tickets/{id}:
    get:
      summary: Obtener Detalle de un Ticket
      description: |
        Devuelve el detalle completo de un ticket. Solo puede consultarlo:

        - el **CLIENTE** que lo creó,
        - el **OPERARIO** asignado al ticket,
        - un **ADMIN** (acceso total).

        Si el usuario no participa del ticket, responde `403 Forbidden`.
      tags:
        - Tickets (Cliente)
        - Tickets (Operario)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID del ticket
      responses:
        '200':
          description: Detalle del ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          description: UUID de ticket con formato inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token ausente, inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: El usuario no es el cliente dueño ni el operario asignado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Ticket no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/tickets/{id}/estado:
    patch:
      summary: Actualizar Estado del Ticket
      description: |
        Avanza la máquina de estados del ticket. Requiere rol **OPERARIO** o **ADMIN**.

        Transiciones permitidas:
        - `ASIGNADO` → `EN_CAMINO`
        - `EN_CAMINO` → `EN_PROGRESO`

        **Importante:** el estado `FINALIZADO` **no** se puede setear por este endpoint.
        Todo cierre debe pasar por `POST /tickets/{id}/finalizar`, que exige precio final,
        método de pago y evidencia. Para cancelar se usa `PATCH /tickets/{id}/cancelar`.

        Si el usuario es **OPERARIO**, debe ser el operario asignado al ticket; de lo
        contrario responde `403 Forbidden`. Cualquier otra transición devuelve `400`.
      tags:
        - Tickets (Operario / Admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID del ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketActualizarEstadoRequest'
      responses:
        '200':
          description: Estado actualizado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Transición de estado inválida o body inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token ausente, inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: El usuario no es el operario asignado (o no tiene rol OPERARIO/ADMIN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Ticket no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/tickets/{id}/evidencia/upload-url:
    post:
      summary: Generar Presigned URL para Subir Evidencia
      description: |
        Genera una URL prefirmada (`PUT`) con validez de 5 minutos para subir directamente
        a MinIO/S3 la foto de evidencia del trabajo. Requiere rol **OPERARIO**.

        Validaciones:
        - `content_type` debe ser `image/jpeg`, `image/png` o `image/webp`.
        - El operario autenticado debe ser el **operario asignado** al ticket (`403 Forbidden` si no).
        - El ticket debe estar en estado **EN_PROGRESO** (`400 Bad Request` si no).

        Una vez subido el archivo mediante `PUT` a `upload_url`, el frontend envía `public_url`
        como `evidencia_url` en `POST /api/v1/tickets/{id}/finalizar`.
      tags:
        - Tickets (Operario)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID del ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketEvidenciaUploadUrlRequest'
      responses:
        '200':
          description: URL prefirmada generada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketEvidenciaUploadUrlResponse'
        '400':
          description: Tipo de archivo no soportado, ticket fuera de EN_PROGRESO o body inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token ausente, inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: El usuario no es el operario asignado (o no tiene rol OPERARIO)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Ticket no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/tickets/{id}/finalizar:
    post:
      summary: Registrar Evidencia y Cobro
      description: |
        Cierra el trabajo operativo y adjunta la foto de evidencia. Requiere rol **OPERARIO**.

        El operario autenticado debe ser el **operario asignado** al ticket; de lo contrario
        responde `403 Forbidden`. El ticket debe estar en estado **EN_PROGRESO**; de lo
        contrario se devuelve `400 Bad Request`.

        Al finalizar, el ticket pasa a estado **FINALIZADO** y se registran en una sola
        operación el precio final, el método de pago y la URL de evidencia.
      tags:
        - Tickets (Operario)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID del ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketFinalizarRequest'
      responses:
        '200':
          description: Trabajo finalizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: El ticket no está EN_PROGRESO o el body es inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token ausente, inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: El usuario no es el operario asignado (o no tiene rol OPERARIO)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Ticket no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/tickets/{id}/cancelar:
    patch:
      summary: Cancelar un Ticket
      description: |
        Cancela un ticket que todavía no fue finalizado, lo pasa a estado **CANCELADO**
        y registra atómicamente la transición y el `motivo` opcional en `ticket_history`.

        Puede cancelarlo:
        - el **CLIENTE** dueño del ticket,
        - el **OPERARIO** asignado,
        - un **ADMIN**.

        Acepta un body JSON opcional `{ "motivo": "..." }` (máx. 500 caracteres), manteniendo
        compatibilidad cuando el body se envía vacío.

        No se puede cancelar un ticket en estado `FINALIZADO` o `CANCELADO`
        (responde `400 Bad Request`). Si el usuario no participa del ticket,
        responde `403 Forbidden`.
      tags:
        - Tickets (Cliente)
        - Tickets (Operario)
        - Tickets (Operario / Admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID del ticket
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketCancelarRequest'
      responses:
        '200':
          description: Ticket cancelado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: El ticket ya está FINALIZADO o CANCELADO, motivo > 500 caracteres o UUID inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token ausente, inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: El usuario no es el cliente dueño, el operario asignado ni ADMIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Ticket no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/tickets/{id}/historial:
    get:
      summary: Obtener Historial de Estados de un Ticket (Admin)
      description: |
        Devuelve la línea de tiempo cronológica (`created_at ASC`) de todas las transiciones
        de estado registradas en `ticket_history` para el ticket indicado, enriquecidas con
        el nombre y rol del usuario que ejecutó cada acción.

        Requiere exclusivamente rol **ADMIN**. Si el ticket fue creado antes de activar la
        auditoría, devuelve `[]` (`200 OK`).
      tags:
        - Tickets (Operario / Admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID del ticket
      responses:
        '200':
          description: Lista cronológica de eventos de auditoría del ticket
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketHistoryEntry'
        '400':
          description: UUID de ticket con formato inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token ausente, inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: El usuario autenticado no tiene rol ADMIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Ticket no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/tickets/{id}/calificar:
    post:
      summary: Calificar Servicio de un Ticket Finalizado
      description: |
        Permite al **CLIENTE** dueño de un ticket en estado **FINALIZADO** registrar
        una puntuación (`1` a `5`) y un comentario opcional (máx. 500 caracteres).

        Validaciones:
        - `puntuacion` entre `1` y `5` (`400 Bad Request`).
        - El ticket debe existir (`404 Not Found`), pertenecer al cliente autenticado (`403 Forbidden`)
          y encontrarse en estado `FINALIZADO` (`400 Bad Request`).
        - Solo se admite una reseña por ticket (`409 Conflict` si ya fue calificado).
      tags:
        - Tickets (Cliente)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID del ticket finalizado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketCalificarRequest'
      responses:
        '201':
          description: Reseña registrada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketReview'
        '400':
          description: Puntuación fuera de rango (1..5), comentario > 500 caracteres, ticket no FINALIZADO o UUID inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token ausente, inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: El usuario no tiene rol CLIENTE o no es el dueño del ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Ticket no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflicto - Este ticket ya fue calificado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT obtenido en `POST /api/v1/auth/login`.

  schemas:
    UsuarioRegistroRequest:
      type: object
      required:
        - nombre
        - email
        - password
        - rol
      properties:
        nombre:
          type: string
          maxLength: 150
          example: "Juan Pérez"
        email:
          type: string
          format: email
          maxLength: 150
          example: "juan.perez@example.com"
        password:
          type: string
          format: password
          minLength: 6
          example: "secret123"
        telefono:
          type: string
          maxLength: 50
          example: "+54 11 5555-1234"
        rol:
          type: string
          enum: [CLIENTE, OPERARIO]
          example: "CLIENTE"

    UsuarioRegistroResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "4196cbe5-f509-4009-acb0-7311c58359c0"
        nombre:
          type: string
          example: "Juan Pérez"
        email:
          type: string
          format: email
          example: "juan.perez@example.com"
        rol:
          type: string
          enum: [CLIENTE, OPERARIO, ADMIN]
          example: "CLIENTE"
        estado_aprobacion:
          type: string
          enum: [PENDIENTE, APROBADO, RECHAZADO]
          description: PENDIENTE para nuevos registros OPERARIO; APROBADO para CLIENTE.
          example: "APROBADO"

    UsuarioLoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "juan.perez@example.com"
        password:
          type: string
          format: password
          example: "secret123"

    UsuarioLoginResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT firmado (HS256) con expiración de 24 horas.
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

    UserProfile:
      type: object
      description: Datos públicos del perfil del usuario autenticado (sin password_hash).
      properties:
        id:
          type: string
          format: uuid
          example: "4196cbe5-f509-4009-acb0-7311c58359c0"
        nombre:
          type: string
          example: "Juan Pérez"
        email:
          type: string
          format: email
          example: "juan.perez@example.com"
        telefono:
          type: string
          example: "+54 11 5555-1234"
        rol:
          type: string
          enum: [CLIENTE, OPERARIO, ADMIN]
          example: "CLIENTE"
        estado_aprobacion:
          type: string
          enum: [PENDIENTE, APROBADO, RECHAZADO]
          example: "APROBADO"
        created_at:
          type: string
          format: date-time
          example: "2026-11-12T19:00:00Z"

    OperarioAdminItem:
      type: object
      description: Datos de un operario expuestos en el listado administrativo.
      properties:
        id:
          type: string
          format: uuid
          example: "f9f6a086-06eb-4f2a-a82c-21a9a52eb8ef"
        nombre:
          type: string
          example: "Carlos Gómez"
        email:
          type: string
          format: email
          example: "carlos.gomez@example.com"
        telefono:
          type: string
          example: "+54 11 4444-5555"
        estado_aprobacion:
          type: string
          enum: [PENDIENTE, APROBADO, RECHAZADO]
          example: "PENDIENTE"
        created_at:
          type: string
          format: date-time
          example: "2026-11-24T19:45:00Z"

    OperarioActualizarAprobacionRequest:
      type: object
      required:
        - estado_aprobacion
      properties:
        estado_aprobacion:
          type: string
          enum: [APROBADO, RECHAZADO]
          example: "APROBADO"

    UsuarioActualizarPerfilRequest:
      type: object
      required:
        - nombre
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 150
          example: "Juan Ignacio Pérez"
        telefono:
          type: string
          maxLength: 50
          example: "+54 11 5555-9876"

    UsuarioCambiarPasswordRequest:
      type: object
      required:
        - password_actual
        - password_nueva
      properties:
        password_actual:
          type: string
          format: password
          example: "secret123"
        password_nueva:
          type: string
          format: password
          minLength: 6
          example: "nuevaClaveSegura456"

    TicketCrearRequest:
      type: object
      required:
        - servicio_id
        - direccion
        - descripcion_problema
      properties:
        servicio_id:
          type: integer
          example: 1
        direccion:
          type: string
          example: "Av. Corrientes 1234, CABA"
        descripcion_problema:
          type: string
          example: "Pérdida de agua bajo la bacha de la cocina."

    TicketCreadoResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        cliente_id:
          type: string
          format: uuid
          description: Se obtiene del claim user_id del JWT.
          example: "4196cbe5-f509-4009-acb0-7311c58359c0"
        estado:
          type: string
          example: "CREADO"
        created_at:
          type: string
          format: date-time
          example: "2026-11-12T19:00:00Z"

    Ticket:
      type: object
      description: Entidad completa de un ticket tal como la devuelve la API.
      properties:
        id:
          type: string
          format: uuid
          example: "3384504f-76f0-4890-ae4e-c0460d89a178"
        cliente_id:
          type: string
          format: uuid
          example: "4196cbe5-f509-4009-acb0-7311c58359c0"
        operario_id:
          type: string
          format: uuid
          nullable: true
          description: Nulo mientras el ticket esté en estado CREADO.
          example: "f9f6a086-06eb-4f2a-a82c-21a9a52eb8ef"
        servicio_id:
          type: integer
          example: 1
        estado:
          type: string
          enum: [CREADO, ASIGNADO, EN_CAMINO, EN_PROGRESO, FINALIZADO, CANCELADO]
          example: "ASIGNADO"
        direccion:
          type: string
          example: "Av. de Mayo 900, CABA"
        descripcion_problema:
          type: string
          example: "Caño roto en el baño."
        precio_final:
          type: number
          format: float
          nullable: true
          description: Nulo hasta que el ticket se finaliza.
          example: 25000.00
        metodo_pago:
          type: string
          nullable: true
          enum: [EFECTIVO, QR, TRANSFERENCIA]
          example: "EFECTIVO"
        evidencia_url:
          type: string
          format: uri
          nullable: true
          example: "https://storage.midominio.com/evidencia/ticket_a1b2c3d4.jpg"
        resena:
          allOf:
            - $ref: '#/components/schemas/TicketReview'
          nullable: true
          description: Presente únicamente cuando el ticket finalizado ya fue calificado por el cliente.
        created_at:
          type: string
          format: date-time
          example: "2026-11-18T22:55:34Z"
        updated_at:
          type: string
          format: date-time
          example: "2026-11-19T19:08:56Z"

    Service:
      type: object
      description: Servicio del catálogo de la plataforma.
      properties:
        id:
          type: integer
          example: 1
        nombre:
          type: string
          example: "Plomería"
        descripcion:
          type: string
          nullable: true
          example: "Reparaciones generales de plomería"
        tarifa_base:
          type: number
          format: float
          example: 15000.00
        created_at:
          type: string
          format: date-time
          example: "2026-11-18T18:17:10Z"

    ServicePayloadRequest:
      type: object
      required:
        - nombre
        - tarifa_base
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 100
          example: "Aire Acondicionado"
        descripcion:
          type: string
          nullable: true
          example: "Instalación, carga de gas y mantenimiento de equipos split"
        tarifa_base:
          type: number
          format: float
          minimum: 0.01
          example: 28000.00

    OperarioActualizarServiciosRequest:
      type: object
      required:
        - servicio_ids
      properties:
        servicio_ids:
          type: array
          description: Lista de IDs de servicios del catálogo que realiza el operario (puede ser [] para limpiar).
          items:
            type: integer
          example: [1, 2]

    TicketDisponible:
      type: object
      properties:
        id:
          type: string
          format: uuid
        servicio:
          type: string
          example: "Plomería"
        direccion:
          type: string
          example: "Av. Corrientes 1234, CABA"
        descripcion_problema:
          type: string
        tarifa_base:
          type: number
          format: float
          example: 15000.00
        created_at:
          type: string
          format: date-time

    TicketActualizarEstadoRequest:
      type: object
      required:
        - nuevo_estado
      properties:
        nuevo_estado:
          type: string
          enum: [EN_CAMINO, EN_PROGRESO]
          description: FINALIZADO se gestiona únicamente vía /finalizar; CANCELADO vía /cancelar.
          example: "EN_CAMINO"

    TicketCancelarRequest:
      type: object
      properties:
        motivo:
          type: string
          maxLength: 500
          description: Motivo opcional de la cancelación registrado en ticket_history.
          example: "El cliente reprogramó el servicio para la próxima semana."

    TicketHistoryEntry:
      type: object
      description: Evento de transición en el historial de auditoría de un ticket.
      properties:
        id:
          type: string
          format: uuid
          example: "b2d4f6a8-1234-4c5d-8e9f-0a1b2c3d4e5f"
        ticket_id:
          type: string
          format: uuid
          example: "3384504f-76f0-4890-ae4e-c0460d89a178"
        estado_anterior:
          type: string
          nullable: true
          enum: [CREADO, ASIGNADO, EN_CAMINO, EN_PROGRESO, FINALIZADO, CANCELADO]
          description: Nulo en el evento inicial de creación del ticket.
          example: "CREADO"
        estado_nuevo:
          type: string
          enum: [CREADO, ASIGNADO, EN_CAMINO, EN_PROGRESO, FINALIZADO, CANCELADO]
          example: "ASIGNADO"
        usuario_id:
          type: string
          format: uuid
          example: "f9f6a086-06eb-4f2a-a82c-21a9a52eb8ef"
        usuario_nombre:
          type: string
          example: "Carlos Gómez"
        usuario_rol:
          type: string
          enum: [CLIENTE, OPERARIO, ADMIN]
          example: "OPERARIO"
        motivo:
          type: string
          example: ""
        created_at:
          type: string
          format: date-time
          example: "2026-11-24T19:35:00Z"

    TicketEvidenciaUploadUrlRequest:
      type: object
      required:
        - content_type
      properties:
        content_type:
          type: string
          enum: [image/jpeg, image/png, image/webp]
          example: "image/jpeg"

    TicketEvidenciaUploadUrlResponse:
      type: object
      required:
        - upload_url
        - public_url
      properties:
        upload_url:
          type: string
          format: uri
          description: URL prefirmada temporal (5 min) para subir el binario vía HTTP PUT.
          example: "http://localhost:9000/evidencias/tickets/3384504f/9b1deb4d.jpg?X-Amz-Algorithm=AWS4-HMAC-SHA256&..."
        public_url:
          type: string
          format: uri
          description: URL pública final del objeto para enviar en POST /tickets/{id}/finalizar.
          example: "http://localhost:9000/evidencias/tickets/3384504f/9b1deb4d.jpg"

    TicketFinalizarRequest:
      type: object
      required:
        - precio_final
        - metodo_pago
      properties:
        precio_final:
          type: number
          format: float
          example: 25000.00
        metodo_pago:
          type: string
          enum: [EFECTIVO, QR, TRANSFERENCIA]
          example: "EFECTIVO"
        evidencia_url:
          type: string
          format: uri
          example: "https://storage.midominio.com/evidencia/ticket_a1b2c3d4.jpg"

    TicketCalificarRequest:
      type: object
      required:
        - puntuacion
      properties:
        puntuacion:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        comentario:
          type: string
          maxLength: 500
          example: "Excelente trabajo, llegó puntual y resolvió todo rápido."

    TicketReview:
      type: object
      description: Reseña emitida por el cliente sobre un ticket finalizado.
      properties:
        id:
          type: string
          format: uuid
          example: "8c0a2c70-4e11-452d-b260-3d8ea6b1e5a1"
        ticket_id:
          type: string
          format: uuid
          example: "3384504f-76f0-4890-ae4e-c0460d89a178"
        cliente_id:
          type: string
          format: uuid
          example: "4196cbe5-f509-4009-acb0-7311c58359c0"
        operario_id:
          type: string
          format: uuid
          example: "f9f6a086-06eb-4f2a-a82c-21a9a52eb8ef"
        puntuacion:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        comentario:
          type: string
          example: "Excelente trabajo"
        created_at:
          type: string
          format: date-time
          example: "2026-11-24T19:00:00Z"

    OperarioRating:
      type: object
      description: Resumen de reputación y reseñas recibidas por un operario.
      properties:
        promedio:
          type: number
          format: float
          example: 4.8
        total_resenas:
          type: integer
          example: 5
        resenas:
          type: array
          items:
            $ref: '#/components/schemas/TicketReview'

    MessageResponse:
      type: object
      properties:
        message:
          type: string
          example: "ticket asignado exitosamente"

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "credenciales inválidas"
